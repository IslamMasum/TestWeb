# .github/workflows/pull-request.yml
name: Automate Pull Request and Review Workflows

on:
  push:
    branches:
      - '*' # Trigger on all branches

jobs:
  create-pr-and-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Get Open Issues Linked to Branch
        id: find_issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF##*/}")
          echo "Checking for issues linked to branch: $BRANCH_NAME"
          ISSUES=$(gh issue list --state open --search "$BRANCH_NAME" --json number --jq '.[] | .number')
          echo "Issues found: $ISSUES"

      - name: Create Pull Request
        if: env.issues != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_TITLE="Auto PR: Branch ${BRANCH_NAME}"
          gh pr create --title "$PR_TITLE" --body "Automated PR for branch $BRANCH_NAME"

      - name: Review and Close Issues
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Extracting issue number from the commit message..."
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          CLOSING_KEYWORDS=("fixes" "closes" "resolves")
          ISSUE_NUMBER=""
          for keyword in ${CLOSING_KEYWORDS[@]}; do
            if [[ "$COMMIT_MESSAGE" == *"$keyword"* ]]; then
              ISSUES=$(echo "${COMMIT_MESSAGE} | grep -oE "#[0-9]+" | tr -d '#')
              break
            fi
          done

  # Run the review and close issues job on each commit that triggers a pull request
