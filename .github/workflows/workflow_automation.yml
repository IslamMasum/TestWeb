name: Automate Pull Request and Review Workflows

on:
  push:
    branches:
      - '*' # Trigger on all branches

permissions:
  contents: read
  security-events: write

jobs:
  create_pull_request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Get Open Issues Linked to Branch
        id: find_issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF##*/}")
          echo "Checking for issues linked to branch: $BRANCH_NAME"
          ISSUES=$(gh issue list --state open --search "$BRANCH_NAME" --json number --jq '.[] | .number')
          echo "Issues found: $ISSUES"
          echo "branch=$BRANCH_NAME" >> $GITHUB_ENV
          echo "issues=$ISSUES" >> $GITHUB_ENV

      - name: Create Pull Request
        if: env.issues != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_TITLE="Auto PR: Branch ${BRANCH_NAME}"
          echo "Creating pull request with title: $PR_TITLE"
          gh pr create --title "$PR_TITLE" --body "Automated PR for branch $BRANCH_NAME" --reviewer "IslamMasum" --base main

  code_review:
    needs: create_pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript,python' # Adjust based on your repo's languages

      - name: Perform Build
        run: |
          if [ -f package.json ]; then
            echo "Installing dependencies and building the project..."
            npm install
            npm run build
          else
            echo "No build required. Skipping build step."
          fi

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: security

      - name: Comment on Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Code review completed. Commenting on the pull request..."
          gh pr comment --body "Automated Code Review Completed"

  post_merge:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Extract Issue Number and Close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Extracting issue number from the commit message..."
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MESSAGE"

          CLOSING_KEYWORDS=("fixes" "closes" "resolves")
          ISSUE_NUMBER=""
          for keyword in ${CLOSING_KEYWORDS[@]}; do
            if [[ "$COMMIT_MESSAGE" == *"$keyword"* ]]; then
              ISSUE_NUMBER=$(echo "$COMMIT_MESSAGE" | grep -oE "#[0-9]+" | tr -d '#')
              break
            fi
          done

          if [[ -z "$ISSUE_NUMBER" ]]; then
            echo "No issue found to close."
          else
            echo "Closing issue #$ISSUE_NUMBER"
            gh issue close $ISSUE_NUMBER
          fi
